<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .btn-row .buy { margin-top: 0; }
    .buy.alt { background: var(--magenta); color: var(--void); }
    .buy.alt:hover { background: #ff8cc4; box-shadow: 0 0 20px rgba(255, 61, 154, 0.7); }
    button.buy.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    .buy.ghost:hover { background: transparent; color: var(--text); box-shadow: none; }
  </style>
</head>
<body>
  <main class="narrow">
    <h1 class="admin-title">Admin</h1>

    <section id="gate">
      <form id="gateForm" class="panel">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <button class="buy" type="submit">Unlock</button>
        <p id="gateMsg" class="msg" role="alert"></p>
      </form>
    </section>

    <section id="panel" hidden>
      <div class="panel">
        <p class="muted">Saved so far</p>
        <p class="big" id="current">$0.00</p>

        <form id="addForm">
          <label for="amount">Amount</label>
          <input id="amount" type="number" step="0.01" min="0" placeholder="20.00" required>
          <div class="btn-row">
            <button class="buy" type="submit">Add to saving</button>
            <button class="buy alt" type="button" id="removeBtn">Remove from saving</button>
          </div>
        </form>

        <div class="btn-row">
          <button class="buy ghost" type="button" id="resetBtn">Reset to $0</button>
        </div>

        <p id="msg" class="msg" role="status"></p>
        <textarea id="manual" rows="4" hidden readonly></textarea>
      </div>

      <details class="panel" id="setup">
        <summary>GitHub connection</summary>
        <p class="muted small">Needed once so this page can update savings.json in your repo. Saved only in this browser. Use a fine-grained token with Contents read and write access to this one repo.</p>
        <form id="cfgForm">
          <label for="owner">GitHub username</label>
          <input id="owner" autocomplete="off">
          <label for="repo">Repo name</label>
          <input id="repo" autocomplete="off">
          <label for="branch">Branch</label>
          <input id="branch" placeholder="main" autocomplete="off">
          <label for="token">Access token</label>
          <input id="token" type="password" autocomplete="off">
          <button class="buy" type="submit">Save connection</button>
        </form>
      </details>
    </section>
  </main>

  <script>
    // Change these passwords. Anyone who views this file's source can read them,
    // so treat it as a casual lock, not real security.
    const PASSWORDS = ["changeme", "changeme", "changeme"];

    const $ = id => document.getElementById(id);
    const money = n => n.toLocaleString("en-US", { style: "currency", currency: "USD" });
    const KEY = "pcsite-github";
    const cfg = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
    let current = 0;

    function show(n) { current = n; $("current").textContent = money(n); }

    async function readCurrent() {
      const c = cfg();
      try {
        if (c.owner && c.repo && c.token) {
          const r = await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}/contents/savings.json?ref=${c.branch || "main"}`,
            { headers: { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json" } });
          if (r.ok) { const j = await r.json(); return Number(JSON.parse(atob(j.content.replace(/\n/g, ""))).saved) || 0; }
        }
        const r = await fetch("savings.json?t=" + Date.now());
        return Number((await r.json()).saved) || 0;
      } catch { return 0; }
    }

    // delta changes the saved amount. reset = true sets it to $0 instead.
    async function changeAmount(delta, reset = false) {
      const c = cfg();
      const body = n => JSON.stringify({ saved: Math.round(n * 100) / 100, updated: new Date().toISOString() }, null, 2) + "\n";

      if (!(c.owner && c.repo && c.token)) {
        const next = reset ? 0 : Math.max(0, current + delta);
        $("manual").hidden = false;
        $("manual").value = body(next);
        $("setup").open = true;
        $("msg").textContent = "Not connected to GitHub yet. Fill in the connection below, or paste this into savings.json yourself.";
        return;
      }

      const url = `https://api.github.com/repos/${c.owner}/${c.repo}/contents/savings.json`;
      const branch = c.branch || "main";
      const headers = { Authorization: `Bearer ${c.token}`, Accept: "application/vnd.github+json" };
      const g = await fetch(`${url}?ref=${branch}`, { headers });
      let sha, base = 0;
      if (g.ok) { const j = await g.json(); sha = j.sha; base = Number(JSON.parse(atob(j.content.replace(/\n/g, ""))).saved) || 0; }
      const next = reset ? 0 : Math.max(0, base + delta);
      const p = await fetch(url, {
        method: "PUT", headers,
        body: JSON.stringify({ message: `Update saving to ${money(next)}`, content: btoa(body(next)), branch, sha })
      });
      if (!p.ok) throw new Error((await p.json()).message || p.status);
      show(next);
      $("manual").hidden = true;
      $("msg").textContent = "Saved. The site updates in about a minute.";
    }

    async function run(delta, reset) {
      $("msg").textContent = "Saving…";
      try { await changeAmount(delta, reset); $("amount").value = ""; }
      catch (err) { $("msg").textContent = "Couldn’t save: " + err.message; }
    }

    function unlock() {
      $("gate").hidden = true;
      $("panel").hidden = false;
      const c = cfg();
      ["owner", "repo", "branch", "token"].forEach(k => $(k).value = c[k] || "");
      readCurrent().then(show);
    }

    $("gateForm").addEventListener("submit", e => {
      e.preventDefault();
      if (PASSWORDS.includes($("pw").value)) unlock();
      else $("gateMsg").textContent = "Wrong password. Try again.";
    });

    // Add
    $("addForm").addEventListener("submit", e => {
      e.preventDefault();
      const amt = parseFloat($("amount").value);
      if (isFinite(amt)) run(Math.abs(amt), false);
    });

    // Remove
    $("removeBtn").addEventListener("click", () => {
      if (!$("addForm").reportValidity()) return;
      const amt = parseFloat($("amount").value);
      if (isFinite(amt)) run(-Math.abs(amt), false);
    });

    // Reset to $0
    $("resetBtn").addEventListener("click", () => {
      if (confirm("Reset saving to $0.00?")) run(0, true);
    });

    $("cfgForm").addEventListener("submit", e => {
      e.preventDefault();
      localStorage.setItem(KEY, JSON.stringify({
        owner: $("owner").value.trim(), repo: $("repo").value.trim(),
        branch: $("branch").value.trim(), token: $("token").value.trim()
      }));
      $("msg").textContent = "Connection saved. Try adding an amount.";
      readCurrent().then(show);
    });
  </script>
</body>
</html>
